name: CI

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master]

# A newer push to the same branch makes an in-progress run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Build and test only need to read the repo.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # The GitHub tests call the real GitHub API; the workflow's own short-lived token avoids the
      # strict rate limit on anonymous requests. Picked up as the app's GitHub:Token setting, and
      # inherited by the MCP server subprocess.
      GitHub__Token: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # The Cosmos tests need an emulator. This is Microsoft's Linux emulator, started now so it warms up
      # while the build runs. HTTPS on 8081 matches the connection string the tests use.
      - name: Start Cosmos DB emulator
        run: |
          docker run --detach --name cosmos -p 8081:8081 -e PROTOCOL=https \
            mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WatchThisForMe.slnx

      - name: Build
        run: dotnet build WatchThisForMe.slnx --configuration Release --no-restore

      - name: Wait for Cosmos DB emulator
        run: |
          for i in $(seq 1 60); do
            if curl --silent --insecure --output /dev/null https://localhost:8081/; then
              echo "Emulator is up."; exit 0
            fi
            sleep 2
          done
          echo "Emulator did not start in time."; docker logs cosmos; exit 1

      - name: Test
        run: dotnet test WatchThisForMe.slnx --configuration Release --no-build --logger "console;verbosity=normal"
